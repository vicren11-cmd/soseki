<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>日本近代书画收藏</title>

<style>

body{
    margin:0;
    background:#f5f1e8;
    color:#333;
    font-family:
    "Noto Serif SC",
    "Songti SC",
    serif;
}


header{
    text-align:center;
    padding:40px 20px;
}

h1{
    font-size:32px;
    font-weight:normal;
    letter-spacing:5px;
}


.subtitle{
    color:#777;
    font-size:15px;
}


.section{
    max-width:1100px;
    margin:40px auto;
    padding:0 20px;
}


.section h2{
    border-left:5px solid #8b6f47;
    padding-left:15px;
    font-weight:normal;
    font-size:24px;
}


.gallery{

    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

    gap:20px;

}


.card{

    background:white;
    padding:15px;
    box-shadow:
    0 3px 12px rgba(0,0,0,.12);

}


.card img{

    width:100%;
    cursor:pointer;

}



.caption{

    text-align:center;
    margin-top:10px;
    color:#555;

}


/* 放大 */

#viewer{

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background:
rgba(0,0,0,.85);

justify-content:center;
align-items:center;

z-index:999;

}


#viewer img{

max-width:95%;
max-height:95%;

}



</style>

</head>


<body>


<header>

<h1>日本近代书画收藏</h1>

<div class="subtitle">
夏目漱石 · 内田百闲 · 明治文人墨迹
</div>

</header>

<div class="section">

<h2>新增作品</h2>


<div class="gallery">


<div class="card">
<img src="keji1.jpg">
<div class="caption">作品1</div>
</div>


<div class="card">
<img src="keji2.jpg">

</div>


<div class="card">
<img src="keji3.jpg">

</div>


<div class="card">
<img src="keji4.jpg">

<div id="viewer">
<img>
</div>



<script>


const imgs=document.querySelectorAll(".card img");

const viewer=document.getElementById("viewer");

const big=viewer.querySelector("img");


imgs.forEach(img=>{

img.onclick=function(){

viewer.style.display="flex";

big.src=this.src;

}

});


viewer.onclick=function(){

viewer.style.display="none";

};


</script>



</body>
</html>
