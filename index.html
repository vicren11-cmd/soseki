body {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;

    background: #f4f2ee;
    color: #333;
}

h1 {
    text-align: center;

    margin-bottom: 8px;
}

.subtitle {

.work-info {

.photo {

.photo img {

    max-width: 100%;
    height: auto;
    margin: 0 auto;
    box-shadow: 0 2px 14px rgba(0,0,0,0.16);
}

.caption {
    text-align: center;

    color: #666;
    font-size: 14px;
}

.details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);

}

.details .photo {
    margin: 0;
}

hr {
    border: none;
    border-top: 1px solid #ddd;
    margin: 80px 0;

@media (max-width: 700px) {
    .details {
        grid-template-columns: 1fr;
